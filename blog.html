<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บล็อกประวัติศาสตร์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600&family=Chonburi&family=IBM+Plex+Sans+Thai+Looped:wght@400;600&family=Pridi:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>

  <section class="page-banner">
    <h1 class="sr-only">บล็อกประวัติศาสตร์</h1>
    <img src="banner-blog.jpg" srcset="banner-blog-sm.jpg 960w, banner-blog.jpg 1920w" sizes="100vw" width="1920" height="640" alt="บล็อกประวัติศาสตร์ – ข่าวสาร ความรู้เพิ่มเติม และกิจกรรมในชั้นเรียน วิชาประวัติศาสตร์ ม.2">
  </section>

  <main>
    <div class="blog-filter" id="blog-filter" role="tablist" aria-label="หมวดบทความ"></div>
    <div id="blog-list" class="blog-list" aria-live="polite">
      <p class="blog-empty">กำลังโหลดบทความ…</p>
    </div>
    <article id="blog-post" class="blog-post" hidden></article>
  </main>

  <nav id="pager"></nav>
  <footer id="site-footer"></footer>
  <script src="main.js"></script>
  <script src="marked.min.js"></script>
  <script src="purify.min.js"></script>
  <script src="blog.js"></script>
</body>
</html>
