# เว็บนี้ไม่ต้อง build ใช้ไฟล์ในโฟลเดอร์นี้ได้เลย
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/blog.json"
  [headers.values]
    Cache-Control = "no-cache"

# เข้า /admin หรือ /admin/ ให้ไปหน้าหลังบ้าน
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 301
